services:
  portfolio-v2:
    build: .
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./app/database.db
      SECRET_KEY: change-me-in-production
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me
      MAX_UPLOAD_MB: 5
      TRUSTED_PROXY_IPS: "*"
    volumes:
      - ./app:/code/app
